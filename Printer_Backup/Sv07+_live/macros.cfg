# Klipper Macros - Shared across all printers
# Custom macros for filament management, preheating, PID calibration, and print control

#====================================================================
# FILAMENT MANAGEMENT
#====================================================================

[gcode_macro LOAD_FILAMENT]
description: Load filament — heat nozzle then feed through extruder. Usage: LOAD_FILAMENT TEMP=220
gcode:
    {% set TEMP = params.TEMP|default(220)|int %}
    M117 Heating for load...
    M104 S{TEMP}
    M109 S{TEMP}
    M117 Loading filament...
    M83
    G1 E25 F300    # Slow feed through sensor/path
    G1 E50 F600    # Faster push to prime nozzle
    M82
    M117 Filament loaded — purge if needed

[gcode_macro UNLOAD_FILAMENT]
description: Unload filament — heat nozzle then retract clear of hotend. Usage: UNLOAD_FILAMENT TEMP=220
gcode:
    {% set TEMP = params.TEMP|default(220)|int %}
    M117 Heating for unload...
    M104 S{TEMP}
    M109 S{TEMP}
    M117 Unloading filament...
    M83
    G1 E8 F200     # Small push to relieve pressure
    G1 E-80 F900   # Retract clear of hotend path
    M82
    M117 Filament unloaded

#====================================================================
# PREHEAT PRESETS
#====================================================================

[gcode_macro PREHEAT_PLA]
description: Preheat for PLA with 10 minute heat soak
gcode:
    M140 S65   # Start bed heating
    M104 S150  # Start extruder heating
    M190 S65   # Wait for bed to reach temp
    M109 S150  # Wait for extruder to reach temp
    RESPOND MSG="Heat soak starting - waiting 10 minutes..."
    G4 P600000 # Wait 10 minutes (600,000ms)
    RESPOND MSG="Heat soak complete!"

[gcode_macro PREHEAT_PETG]
description: Preheat for PETG with 10 minute heat soak
gcode:
    M140 S75   # Start bed heating
    M104 S180  # Start extruder heating
    M190 S75   # Wait for bed to reach temp
    M109 S180  # Wait for extruder to reach temp
    RESPOND MSG="Heat soak starting - waiting 10 minutes..."
    G4 P600000 # Wait 10 minutes (600,000ms)
    RESPOND MSG="Heat soak complete!"

[gcode_macro PREHEAT_ABS]
description: Preheat for ABS with 10 minute heat soak
gcode:
    M140 S100  # Start bed heating
    M104 S245  # Start extruder heating
    M190 S100  # Wait for bed to reach temp
    M109 S245  # Wait for extruder to reach temp
    RESPOND MSG="Heat soak starting - waiting 10 minutes..."
    G4 P600000 # Wait 10 minutes (600,000ms)
    RESPOND MSG="Heat soak complete!"

#====================================================================
# CALIBRATION & TUNING
#====================================================================

[gcode_macro PA_CALIBRATE]
description: Start pressure advance calibration pattern
gcode:
    SET_VELOCITY_LIMIT SQUARE_CORNER_VELOCITY=1 ACCEL=500
    TUNING_TOWER COMMAND=SET_PRESSURE_ADVANCE PARAMETER=ADVANCE START=0 FACTOR=.005

[gcode_macro GET_POSITION_STATS]
description: Display current position information
gcode:
    {% set FH = printer.toolhead.position.z %}
    RESPOND MSG="Print Height: {FH}"
    M114

#====================================================================
# PID CALIBRATION
#====================================================================

[gcode_macro PID_BED]
description: Calibrate bed PID - Usage: PID_BED BED_TEMP=70
gcode:
    G90
    {% if printer.toolhead.homed_axes != "xyz" %}
        G28
    {% endif %}
    G1 Z10 F600
    M106
    PID_CALIBRATE HEATER=heater_bed TARGET={params.BED_TEMP|default(70)}
    M107
    {% set y_park = printer.toolhead.axis_maximum.y / 2 %}
    {% set x_park = printer.toolhead.axis_maximum.x|float - 10.0 %}
    G1 X{x_park} Y{y_park} F20000

[gcode_macro PID_HOTEND]
description: Calibrate hotend PID - Usage: PID_HOTEND HOTEND_TEMP=200
gcode:
    G90
    {% if printer.toolhead.homed_axes != "xyz" %}
        G28
    {% endif %}
    G1 Z10 F600
    M106
    PID_CALIBRATE HEATER=extruder TARGET={params.HOTEND_TEMP|default(200)}
    M107
    {% set y_park = printer.toolhead.axis_maximum.y / 2 %}
    {% set x_park = printer.toolhead.axis_maximum.x|float - 10.0 %}
    G1 X{x_park} Y{y_park} F20000

#====================================================================
# PRINT CONTROL
#====================================================================

[gcode_macro CANCEL_PRINT]
description: Cancel the running print — park toolhead, heaters off, motors off
rename_existing: CANCEL_PRINT_BASE
gcode:
    G31                 # Sovol PLR: clear_plr + was_interrupted=False (plr.cfg)
    clear_last_file     # Sovol PLR: forget last file so no resume prompt after cancel
    TURN_OFF_HEATERS
    M107
    _TOOLHEAD_PARK_PAUSE_CANCEL
    M84
    CANCEL_PRINT_BASE

#====================================================================
# BED LEVELING
#====================================================================

[gcode_macro MANUAL_LEVEL]
description: Home and calculate screw adjustments for manual leveling
gcode:
    G28
    SCREWS_TILT_CALCULATE
    G90
    {% set x_center = printer.toolhead.axis_maximum.x / 2 %}
    {% set y_center = printer.toolhead.axis_maximum.y / 2 %}
    G1 F3000 X{x_center} Y{y_center} Z25

[gcode_macro M420]
description: Load the saved default bed mesh
gcode:
    BED_MESH_PROFILE LOAD=default

