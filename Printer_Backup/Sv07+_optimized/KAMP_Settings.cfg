# KAMP settings — Sovol SV07 Plus
#
# INSTALL (SSH in as mks / makerbase):
#   cd ~ && git clone https://github.com/kyleisah/Klipper-Adaptive-Meshing-Purging.git
#   ln -s ~/Klipper-Adaptive-Meshing-Purging/Configuration ~/printer_data/config/KAMP
#   copy THIS file to ~/printer_data/config/KAMP_Settings.cfg
#
# moonraker.conf must contain:
#   [file_manager]
#   enable_object_processing: True
#
# Optional — Mainsail/Fluidd update manager entry for moonraker.conf:
#   [update_manager Klipper-Adaptive-Meshing-Purging]
#   type: git_repo
#   channel: dev
#   path: ~/Klipper-Adaptive-Meshing-Purging
#   origin: https://github.com/kyleisah/Klipper-Adaptive-Meshing-Purging.git
#   managed_services: klipper
#   primary_branch: main
#
# printer.cfg needs [exclude_object] (already present) and OrcaSlicer must have
# "Label objects" enabled (set in all @SovolSV07Plus process profiles).

[include ./KAMP/Adaptive_Meshing.cfg]       # Adaptive bed mesh (wraps BED_MESH_CALIBRATE)
[include ./KAMP/Line_Purge.cfg]             # Adaptive purge line in front of the print
#[include ./KAMP/Voron_Purge.cfg]           # Voron logo purge (not used)
[include ./KAMP/Smart_Park.cfg]             # Park near print area for final heating

[gcode_macro _KAMP_Settings]
description: This macro contains all adjustable settings for KAMP

# General
variable_verbose_enable: True               # Print KAMP info to console — handy while verifying the setup

# Adaptive mesh
variable_mesh_margin: 5                     # Expand mesh 5mm past the objects' bounding box
variable_fuzz_amount: 0                     # Inductive probe — no nozzle wear to spread out

# Dockable probe (not used on SV07 Plus)
variable_probe_dock_enable: False
variable_attach_macro: 'Attach_Probe'
variable_detach_macro: 'Dock_Probe'

# Adaptive purge
variable_purge_height: 0.8                  # Z height of nozzle during purge
variable_tip_distance: 2                    # Matches the 2mm retract in PRINT_END / CANCEL_PRINT
variable_purge_margin: 10                   # Distance in front of the print area
variable_purge_amount: 30                   # mm of filament purged
variable_flow_rate: 12                      # Purge flow in mm³/s

# Smart Park
variable_smart_park_height: 10              # Z height for Smart Park

gcode: # Gcode section left intentionally blank. Do not disturb.

    {action_respond_info(" Running the KAMP_Settings macro does nothing, it is only used for storing KAMP settings. ")}
